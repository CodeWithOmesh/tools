[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/tools/receipt-generator"
to = "/tools/receipt-generator/index.html"
status = 200

[[redirects]]
from = "/tools/receipt-generator/*"
to = "/tools/receipt-generator/index.html"
status = 200

[[redirects]]
from = "/tools/invoice-generator"
to = "/tools/invoice-generator/index.html"
status = 200

[[redirects]]
from = "/tools/invoice-generator/*"
to = "/tools/invoice-generator/index.html"
status = 200
