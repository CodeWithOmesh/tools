name: Format and verify quotation generator

on:
  push:
    branches: [feat/quotation-generator]
    paths:
      - "quotation-generator/**"
      - ".github/workflows/quotation-prettier.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quotation-generator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format quotation generator with Prettier 3.3.3
        run: npx prettier@3.3.3 --write "quotation-generator/**/*.{ts,tsx,css,html,json}"
      - name: Verify every tool project
        run: npm run verify
      - name: Commit formatted quotation files
        run: |
          if ! git diff --quiet -- quotation-generator; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quotation-generator
            git commit -m "style(quotation-generator): format with Prettier 3.3.3"
            git push origin HEAD:feat/quotation-generator
          fi
